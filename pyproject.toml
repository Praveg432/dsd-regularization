[project]
name = "dsd-svm"
version = "0.1.0"
description = "Differential Spectral Damping for Numerically Stable SVM Pre-Image Computation"
authors = [{name = "Praveg Vashishtha"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0", "ipykernel"]
explainability = ["shap>=0.42"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
